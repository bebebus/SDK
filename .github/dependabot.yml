version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # CodeQL 各步骤必须使用同一版本，否则运行时会拒绝加载配置。
      codeql-actions:
        patterns:
          - "github/codeql-action/*"
    ignore:
      # gh-aw 编译器会统一更新生成工作流中的 action pin，禁止直接合并此类 PR。
      - dependency-name: github/gh-aw-actions/setup

  - package-ecosystem: npm
    directory: /nodejs
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: composer
    directory: /php
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: maven
    directory: /java
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Checkstyle 13.x 运行时要求 Java 21；本 SDK 与发布流程仍以 Java 17 为基线。
      - dependency-name: com.puppycrawl.tools:checkstyle
        update-types:
          - version-update:semver-major

  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
