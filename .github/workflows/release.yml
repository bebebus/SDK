name: Release

# 发布必须由维护者手动确认，避免普通代码 Push 意外发布公共包。
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '已存在的版本 Tag，例如 1.1.3'
        required: true
        type: string
      confirm:
        description: '输入 RELEASE 才会执行手动发布'
        required: true
        type: string
      publish_registries:
        description: '同时发布 npm、PyPI 并同步 PHP 镜像/Packagist'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release:
    name: Build and release SDK
    if: ${{ github.event_name == 'push' || inputs.confirm == 'RELEASE' }}
    runs-on: ubuntu-latest
    environment: release
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          extensions: curl, json

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.21'

      - name: Validate version and existing tag
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          tag="v${version}"
          git rev-parse --verify "refs/tags/${tag}^{commit}" >/dev/null
          test "$(node -p "require('./nodejs/package.json').version")" = "$version"
          test "$(sed -n 's/^version = \"\([^\"]*\)\"/\1/p' python/pyproject.toml)" = "$version"
          test "$(sed -n "s/.*const VERSION = '\([^']*\)'.*/\1/p" php/src/Client.php)" = "$version"
          test "$(sed -n 's/.*public static final String VERSION = \"\([^\"]*\)\";.*/\1/p' java/src/main/java/cloud/cniia/openapi/sdk/Client.java)" = "$version"
          test "$(sed -n 's/.*const Version = \"\([^\"]*\)\".*/\1/p' go/client.go)" = "$version"

      - name: Run all SDK tests
        run: ./release.sh "${RELEASE_VERSION#v}" --dry-run

      - name: Pin build requirements from workflow revision
        run: git show "${GITHUB_SHA}:release-requirements.txt" > "$RUNNER_TEMP/release-requirements.txt"

      - name: Build release assets
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          mkdir -p dist
          (cd nodejs && npm pack --pack-destination "$GITHUB_WORKSPACE/dist")
          python -m pip install --disable-pip-version-check --no-input \
            --require-hashes --only-binary=:all: \
            -r "$RUNNER_TEMP/release-requirements.txt"
          # python 构建产物落独立目录（PyPI 上传步 packages-dir 只能指向纯 python 产物；
          # 根 dist/ 混有 php/java/go tarball），再拷回根 dist/ 保持 GitHub Release 资产不变。
          python -m build --outdir python/dist python
          cp python/dist/* dist/
          tar --exclude='out' --exclude='.DS_Store' -czf "dist/php-${version}.tar.gz" -C php .
          tar --exclude='out' --exclude='.DS_Store' -czf "dist/java-${version}.tar.gz" -C java .
          tar --exclude='out' --exclude='.DS_Store' -czf "dist/go-${version}.tar.gz" -C go .
          find dist -maxdepth 1 -type f -print | sort

      - name: Generate build provenance
        id: provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: 'dist/*'

      # GitHub 会把证明保存到 Attestations API；同时导出为 Release 附件，
      # 便于离线验证，也让 OpenSSF Scorecard 能识别签名与 SLSA provenance。
      - name: Export release signature and provenance
        env:
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          signature="dist/bebebus-sdk-${version}.sigstore.json"
          provenance="dist/bebebus-sdk-${version}.intoto.jsonl"
          cp "$ATTESTATION_BUNDLE" "$signature"
          jq -ce '.dsseEnvelope' "$ATTESTATION_BUNDLE" > "$provenance"
          test -s "$signature"
          test -s "$provenance"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --verify-tag --generate-notes --title "SDK ${tag}"
          fi

      - name: Publish npm package with provenance
        if: ${{ inputs.publish_registries == true }}
        working-directory: nodejs
        # npm Trusted Publishing（OIDC 免令牌，npm 侧已将本 workflow+environment=release 配为
        # Trusted Publisher）：不注入任何 token——残留 token 会抢占认证并触发 EOTP。
        # OIDC 交换需 npm CLI ≥ 11.5.1，Node 22 自带 10.x → 先升级 CLI。
        run: |
          npm install -g npm@latest
          npm publish --provenance --access public

      - name: Publish Python package to PyPI
        if: ${{ inputs.publish_registries == true }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: python/dist/
          skip-existing: true

      - name: Sync PHP mirror and Packagist
        if: ${{ inputs.publish_registries == true }}
        env:
          PHP_MIRROR_TOKEN: ${{ secrets.PHP_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          tag="v${version}"
          # 幂等守卫：镜像仓已有该 tag（如手工同步过）则跳过，保证发布 run 可安全重跑
          if git ls-remote --tags https://github.com/bebebus/merchant-openapi-sdk-php.git "refs/tags/${tag}" | grep -q "${tag}"; then
            echo "PHP mirror already has tag ${tag}; skipping."
            exit 0
          fi
          if [ -z "${PHP_MIRROR_TOKEN:-}" ]; then
            echo '::error::publish_registries=true requires the PHP_MIRROR_TOKEN secret.'
            exit 1
          fi
          mirror="https://x-access-token:${PHP_MIRROR_TOKEN}@github.com/bebebus/merchant-openapi-sdk-php.git"
          split="$(git subtree split --prefix=php | tail -n 1)"
          git push "$mirror" "${split}:refs/heads/main"
          temp_tag="relsplit-${tag}"
          git tag -a "$temp_tag" "$split" -m "$tag"
          git push "$mirror" "${temp_tag}:refs/tags/${tag}"
          git tag -d "$temp_tag"
