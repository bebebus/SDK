# [L25] 跨语言契约护栏：每次 push / PR 跑五语言的 test-vectors 测试。
# 把「跨语言签名逐字节一致」从发版人工门槛升级为每次提交自动回归。
# 各语言测试步骤镜像 release.sh 中 run() 的命令（保持单一事实源一致）。
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gh-aw-codex-integrity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node .github/scripts/test-gh-aw-codex.cjs
      - name: 检查程序源码许可证标识
        run: python3 _tooling/check-spdx.py
      - name: 验证源码归档可重复且内容完整
        run: python3 _tooling/test-source-archives.py

  # Node.js —— node --test（与 release.sh 的 "Node" 步骤一致）
  nodejs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: npm ci
        working-directory: nodejs
        run: npm ci
      - name: eslint
        working-directory: nodejs
        run: npm run lint
      - name: node --test with source coverage
        working-directory: nodejs
        run: node --test --experimental-test-coverage --test-coverage-include='src/**' --test-coverage-lines=90 --test-coverage-branches=80

  # Python —— unittest discover（与 release.sh 的 "Python" 步骤一致）
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: install Ruff
        run: python -m pip install --disable-pip-version-check --require-hashes -r python/requirements-ci.txt
      - name: install coverage.py
        run: python -m pip install --disable-pip-version-check --require-hashes -r python/requirements-coverage.txt
      - name: ruff check
        working-directory: python
        run: ruff check .
      - name: Python 测试与源码覆盖率
        working-directory: python
        run: |
          python -m coverage run --timid --branch --source=openapi_sdk -m unittest discover -s tests
          python -m coverage report -m
          python -m coverage json -o coverage.json
          python ../_tooling/check-python-coverage.py coverage.json

  # PHP —— 自写零依赖 runner（与 release.sh 的 "PHP" 步骤一致）
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          extensions: curl, json
      - name: composer install
        working-directory: php
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: phpstan
        working-directory: php
        run: composer run lint
      - name: php tests/run.php
        working-directory: php
        run: php tests/run.php

  # Java —— 自写断言 runner（与 release.sh 的 "Java" 步骤一致，不依赖 Maven）
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: bash run-tests.sh
        working-directory: java
        run: bash run-tests.sh
      - name: Maven verify with Checkstyle
        working-directory: java
        run: mvn --batch-mode --no-transfer-progress verify

  # Go —— go test（与 release.sh 的 "Go" 步骤一致；-count=1 绕开缓存读外部向量）
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.21'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: go
      - name: go test
        working-directory: go
        run: |
          go test -count=1 ./...
          go test -count=1 -coverprofile=coverage.out .
          awk 'NR > 1 { total += $2; if ($3 > 0) covered += $2 } END { printf "Go 语句覆盖率: %d/%d\n", covered, total; if (total == 0 || covered * 100 < total * 90) exit 1 }' coverage.out
