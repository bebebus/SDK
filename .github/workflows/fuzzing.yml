name: Fuzzing

on:
  schedule:
    - cron: '15 2 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-fuzz:
    name: Go callback verification fuzzing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.21'

      - name: Run Go fuzz target
        working-directory: go
        run: go test -fuzz=FuzzVerifyCallbackNeverPanics -fuzztime=30s .
